<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nyraLeftPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      
    <stop offset="0%" stop-color="#FF2E93" />
    <stop offset="35%" stop-color="#EC4899" />
    <stop offset="70%" stop-color="#A855F7" />
    <stop offset="100%" stop-color="#C084FC" />
  
    </linearGradient>

    <linearGradient id="nyraDiagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      
    <stop offset="0%" stop-color="#EC4899" />
    <stop offset="25%" stop-color="#A855F7" />
    <stop offset="55%" stop-color="#6366F1" />
    <stop offset="85%" stop-color="#38BDF8" />
    <stop offset="100%" stop-color="#06B6D4" />
  
    </linearGradient>

    <linearGradient id="nyraRightPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      
    <stop offset="0%" stop-color="#4F46E5" />
    <stop offset="30%" stop-color="#3B82F6" />
    <stop offset="70%" stop-color="#38BDF8" />
    <stop offset="100%" stop-color="#06B6D4" />
  
    </linearGradient>

    <linearGradient id="nyraGlassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E52A83" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="nyraStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#67E8F9" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#67E8F9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Subsurface Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#ambientBackdrop)" />

  

  <!-- Left Pillar (Smooth Rounded 3D Capsule) -->
  <rect x="14" y="15" width="20" height="70" rx="10" fill="url(#nyraLeftPillar)" />
  <!-- Left Pillar Glossy Specular Rim -->
  <rect x="16.5" y="17.5" width="5.5" height="65" rx="2.75" fill="url(#nyraGlassShine)" opacity="0.6" />

  <!-- Diagonal Ribbon (Volumetric Smooth Bridge from Top-Left to Bottom-Right) -->
  <path
    d="M 18.5 24 C 23 20 32 18 38 24 L 79 72 C 83 77 82 84 76 85 C 70 86 64 82 58 75 L 20 28 C 18 25 18 24.5 18.5 24 Z"
    fill="url(#nyraDiagonal)"
  />

  <!-- Top-Left Crest Blend -->
  <path
    d="M 14 25 C 14 19.5 18.5 15 24 15 C 29.5 15 34 19.5 34 25 L 34 32 C 34 32 28 25 22 25 C 17 25 14 28 14 28 Z"
    fill="#EC4899"
    opacity="0.8"
  />

  <!-- Right Pillar (Smooth Rounded 3D Capsule) -->
  <rect x="66" y="15" width="20" height="70" rx="10" fill="url(#nyraRightPillar)" />
  <!-- Right Pillar Glossy Specular Rim -->
  <rect x="68.5" y="17.5" width="5.5" height="65" rx="2.75" fill="url(#nyraGlassShine)" opacity="0.55" />

  <!-- Center Diamond Star Flare (The Spark of Intelligence) -->
  <circle cx="50" cy="49" r="15" fill="url(#nyraStarGlow)" />
  <!-- 4-Point Concave Diamond Star -->
  <path
    d="M 50 32 Q 50 49 67 49 Q 50 49 50 66 Q 50 49 33 49 Q 50 49 50 32 Z"
    fill="#FFFFFF"
    opacity="0.98"
  />
  <!-- Inner Cross Star Core -->
  <path
    d="M 50 43 L 56 49 L 50 55 L 44 49 Z"
    fill="#FFFFFF"
  />
  <circle cx="50" cy="49" r="2.2" fill="#FFFFFF" />
</svg>